<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kobe Halog</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/020fad7f3d.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img id="personal-logo" src="./assets/logo.svg" alt="" />
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >About</a
            >
          </li>
          <li class="nav__link">
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Projects</a
            >
          </li>
          <li class="nav__link">
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Contact</a
            >
          </li>
          <!-- REMINDER TO CHANGE MOON ANIMATION TO 180DEG CLOCKWISE + INVERT COLOR -->
          <li class="nav__link click-hover-effect">
            <i class="fa-solid fa-circle-half-stroke"></i>
          </li>
        </ul>
      </nav>
      <header>
        <div class="header__content">
          <h1 class="title"></h1>
          <h1 class="title green">Hey I'm Kobe.</h1>
          <p class="header__paragraph">
            I'm a <b class="green">full stack software engineer</b> with a
            special interest in building secure websites with exceptional user
            experiences.
            <br />
            Here's a bit more <b class="green">about me.</b>
          </p>
          <div class="social__list">
            <a href="" class="social click-hover-effect"
              ><i class="fa-brands fa-linkedin"></i
            ></a>
            <a href="" class="social click-hover-effect"
              ><i class="fa-brands fa-github"></i
            ></a>
            <a href="" class="social click-hover-effect"
              ><i class="fa-solid fa-file-pdf"></i
            ></a>
          </div>
        </div>
      </header>
      <button class="mail__btn click-hover-effect">
        <i class="fa-solid fa-envelope"></i>
      </button>
      <a href="#projects" class="scroll">
        <div class="scroll__icon click"></div>
      </a>
    </section>
  </body>
</html>
